<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="description" content="세계 음반 시장의 매출, 국가별 성장률, 곡 수와 장르 수, 재생횟수 분포를 잇는 스크롤 시각화">
<title>INNER//VERSE · Intro</title>
<link rel="icon" href="data:,">
<style>

  :root {
    color-scheme: dark;
    --paper: #edf5f4;
    --muted: #a3b5b8;
    --mint: #9df5db;
    --line: rgba(177, 212, 211, .22);
    --gutter: clamp(24px, 5.1vw, 92px);
    --sans: "Helvetica Neue", "Apple SD Gothic Neo", "Malgun Gothic", Arial, sans-serif;
    --mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html { background: #020205; scroll-behavior: smooth; }
  body { margin: 0; color: var(--paper); font: 16px/1.55 var(--sans); }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; }
  a:focus-visible, button:focus-visible, summary:focus-visible {
    outline: 2px solid var(--mint);
    outline-offset: 4px;
  }
  html, body { height: 100%; overflow: hidden; }

  .resonance {
    position: relative; height: 100svh; min-height: 350px;
    overflow: hidden; isolation: isolate; background: #030308;
    background-image: radial-gradient(ellipse at 49% 52%, #15102075, transparent 66%),
                      radial-gradient(ellipse at 12% 85%, #18122548, transparent 42%);
  }
  .resonance canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .resonance h1 {
    position: absolute; inset: 0; display: grid; place-items: center; margin: 0;
    color: #e8e5f4; font: 750 clamp(30px, 11.3vw, 178px)/1 Arial,sans-serif;
    letter-spacing: -.045em;
  }
  .resonance.ready h1 { clip-path: inset(50%); }
  .resonance a {
    position: absolute; left: 50%; transform: translateX(-50%); bottom: max(23px, env(safe-area-inset-bottom));
    display: inline-flex; align-items: center; gap: 12px; padding: 12px 16px;
    font: 12px/1.2 var(--sans); color: #beb8cd; white-space: nowrap; text-decoration: none;
  }
  .resonance a:hover, .resonance a:focus-visible { color: #fff; }
  .resonance a span { font-size: 17px; line-height: 1; }
</style>
</head>
<body>
<main>
<section class="resonance" id="record-intro" aria-labelledby="resonance-title">
  <canvas aria-hidden="true"></canvas>
  <h1 id="resonance-title">INNER//VERSE</h1>
  <a href="#revenue-story">음악 데이터 살펴보기 <span aria-hidden="true">↓</span></a>
</section>
</main>
<script>
// A traveling audio waveform gathers the stars before they form the title.
(() => {
  const section = document.querySelector('.resonance');
  const canvas = section.querySelector('canvas');
  const ctx = canvas.getContext('2d');
  if (!ctx) return;
  const reduced = matchMedia('(prefers-reduced-motion: reduce)');
  const mask = document.createElement('canvas');
  const ink = mask.getContext('2d', {willReadFrequently: true});
  if (!ink) return;
  const title = section.querySelector('h1').textContent;
  const tones = ['#fcfaff', '#dadbea', '#d6c9ee', '#a18ac6', '#a3abc8'];
  const ease = (a,b,t) => {
    const u = Math.min(1,Math.max(0,(t-a)/(b-a)));
    return u*u*(3-2*u);
  };
  let w=0, h=0, stars=[], handle=0, visible=true, elapsed=0, previous=null;
  let seed=81272;
  function random() {
    seed=(Math.imul(seed,1664525)+1013904223)>>>0;
    return seed/4294967296;
  }

  function letterPixels() {
    mask.width=Math.min(1500,Math.round(w*.86));
    mask.height=Math.max(48,Math.ceil(mask.width*.21));
    ink.font='750 100px Arial,sans-serif';
    const size=Math.min(mask.height*.95, (mask.width-8)*100/ink.measureText(title).width);
    ink.font='750 '+size+'px Arial,sans-serif';
    ink.textAlign='center';
    const bounds=ink.measureText(title);
    const baseline=(mask.height+bounds.actualBoundingBoxAscent-bounds.actualBoundingBoxDescent)/2;
    ink.fillText(title,mask.width/2,baseline);
    const data=ink.getImageData(0,0,mask.width,mask.height).data;
    const pixels=[];
    for(let i=0;i<data.length/4;i++) if(data[4*i+3]>140) pixels.push(i);
    return pixels;
  }

  // Each sample stays at a fixed horizontal position. Increasing time
  // shifts the signal right, so every crest can be followed across the field.
  const samples = 512;
  const signal = new Float32Array(samples);
  const tau = 2 * Math.PI;
  function updateSignal(time) {
    const peak = Math.min(h * .23, w * .16);
    for (let i = 0; i < samples; i++) {
      const u = i / (samples - 1);
      const phase = u - .16 * time;
      const envelope = .44 + .56 * (.5 + .5 * Math.cos(tau * (phase * 1.65 + .08))) ** 2;
      const fundamental = Math.sin(tau * 3.8 * phase);
      const harmonic = .26 * Math.sin(tau * 7.6 * phase + .8) + .13 * Math.sin(tau * 11.4 * phase - .3);
      const taper = Math.sin(Math.PI * u) ** .55;
      signal[i] = peak * taper * envelope * (fundamental + harmonic);
    }
  }

  function layout() {
    const width=section.clientWidth, height=section.clientHeight;
    if (!width||!height||(width===w&&height===h)) return;
    w=width; h=height;
    const ratio=Math.min(devicePixelRatio||1,2);
    canvas.width=Math.round(w*ratio); canvas.height=Math.round(h*ratio);
    ctx.setTransform(ratio,0,0,ratio,0,0);
    seed=81272;
    const pixels=letterPixels();
    if(!pixels.length) return;
    const count=Math.round(Math.max(2200,Math.min(9600,w*h/112)));
    const margin = w < 600 ? w * .045 : w * .07;
    stars=Array.from({length:count},(_,i)=>{
      const sx=random()*w, sy=random()*h, phase=random()*Math.PI*2;
      const u = sx / w;
      const sample = u * (samples - 1);
      const sampleIndex = Math.min(samples - 2, Math.floor(sample));
      const band = (random() + random() + random() - 1.5) * (w < 600 ? 2.6 : 4.8);
      const pixel=pixels[Math.min(pixels.length-1,Math.floor((i+random())/count*pixels.length))];
      const tx=(w-mask.width)/2+pixel%mask.width+.5;
      const ty=(h-mask.height)/2+Math.floor(pixel/mask.width)+.5;
      const ambient=i%13===0;
      return {sx,sy,wx:margin + u * (w - 2 * margin), sampleIndex,
        fraction:sample - sampleIndex,band,tx,ty,phase,ambient,
        delay:random()*.66, size:.48+random()**2*(w<600?.75:1.20),
        opacity:.40+random()*.60,tone:tones[Math.floor(random()*tones.length)]};
    });
    // Break the correspondence between text scanlines and the order of the seeds.
    for(let i=stars.length-1;i>0;i--){
      const a=stars[i], b=stars[Math.floor(random()*(i+1))];
      [a.tx,b.tx]=[b.tx,a.tx]; [a.ty,b.ty]=[b.ty,a.ty];
    }
    section.classList.add('ready');
    paint(); queue();
  }

  function paint() {
    ctx.clearRect(0,0,w,h);
    const t=reduced.matches?12:elapsed;
    updateSignal(t);
    for(const s of stars){
      const wave=s.ambient?0:ease(.65+s.delay,2.35+s.delay,t);
      const word=s.ambient?0:ease(8.25+s.delay,10.65+s.delay,t);
      const phase=s.phase;
      const drift=1-word;
      const i = s.sampleIndex;
      const displacement = signal[i] + s.fraction * (signal[i+1] - signal[i]);
      const wy = h / 2 - displacement + s.band;
      const x = s.sx + (s.wx - s.sx) * wave;
      const y=s.sy+(wy-s.sy)*wave;
      const px=x+(s.tx-x)*word+drift*(2+3*(1-wave))*Math.cos(t*.46+phase);
      const py=y+(s.ty-y)*word+drift*(2+3*(1-wave))*Math.sin(t*.50+phase);
      ctx.fillStyle=s.tone;
      ctx.globalAlpha=s.opacity*(s.ambient?.42:.55+.40*Math.max(wave,word))*(.90+.10*Math.sin(phase+t*1.2));
      const size=s.size*(.80+.23*wave+.36*word);
      ctx.fillRect(px-size/2,py-size/2,size,size);
    }
    ctx.globalAlpha=1;
  }
  function frame(now) {
    handle=0;
    if(!visible||document.hidden) {previous=null;return;}
    if(previous!==null && now-previous<31){queue();return;}
    if(previous!==null) elapsed+=Math.min(.15,(now-previous)/1000);
    previous=now;
    paint();
    if(!reduced.matches && elapsed<11.5) queue();
  }
  function queue(){
    if(!handle&&visible&&!document.hidden) handle=requestAnimationFrame(frame);
  }
  function resume(){
    previous=null;
    if(visible&&!document.hidden){paint();if(!reduced.matches&&elapsed<11.5) queue();}
  }
  // A deliberate sweep stirs the field again; a resting pointer lets the title settle.
  let pointer=null;
  section.addEventListener('pointermove',event=>{
    if(reduced.matches||event.pointerType==='touch')return;
    const p={x:event.clientX,y:event.clientY};
    if(!pointer){pointer=p;return;}
    if(Math.hypot(p.x-pointer.x,p.y-pointer.y)<12)return;
    pointer=p;
    if(elapsed>0.6) elapsed=Math.max(.45,elapsed-.36);
    previous=null;queue();
  });
  section.addEventListener('pointerleave',()=>{pointer=null;});
  new ResizeObserver(layout).observe(section);
  new IntersectionObserver(([entry])=>{visible=entry.isIntersecting;resume();}).observe(section);
  document.addEventListener('visibilitychange',resume);
  reduced.addEventListener('change',resume);
  layout();
})();
</script>
</body>
</html>
